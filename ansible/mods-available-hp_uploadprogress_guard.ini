; hp_uploadprogress_guard for Debian/Ubuntu (Sury layout): /etc/php/<X.Y>/mods-available/, then
; phpenmod -v <X.Y> -s ALL hp_uploadprogress_guard. Mitigation for CVE-2026-109618 / CVE-2026-109619.
; priority=20
extension=hp_uploadprogress_guard.so
; parse  = the module's copy of PHP's hardened multipart parser (default)
; native = leave PHP's own parser in place
; block  = refuse every multipart/form-data request before parsing (415): emergency mode
hp_uploadprogress_guard.mode = parse
; client IPs that are always parsed, even in block mode (comma separated)
hp_uploadprogress_guard.allow_ips =
; drop ext/session's upload-progress handler (session.upload_progress off, non-overridable)
hp_uploadprogress_guard.detach_upload_progress = 1
; opt-in: lock memory_limit to -1 (bound the process with the OS instead)
hp_uploadprogress_guard.force_unlimited_memory = 0
