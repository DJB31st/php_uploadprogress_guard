---
## hp_multipart_guard: PHP's multipart/form-data parser (main/rfc1867.c) carried as a loadable module, so a
## patched parser can be installed on every php version (5.6-8.5, Sury/EA4/CustomBuild) the hour a fix is
## public, without waiting for vendor packages. Same install shape as uploadprogress-guard. Source + build
## script in files/multipart-guard/src. Default OFF (php_multipart_guard_enabled) until the module carries a fix.

- name: Discover installed php-fpm versions -> /usr/sbin/php-fpmX.Y
  ansible.builtin.find:
    paths: /usr/sbin
    patterns: 'php-fpm[0-9].[0-9]'
    use_regex: false
  register: php_multipart_guard_fpm_binaries

## Only versions with a shipped .so (files/multipart-guard/hp_multipart_guard-X.Y.so = every minor Sury publishes, 5.6-8.5).
- name: set fact php_multipart_guard_versions
  ansible.builtin.set_fact:
    php_multipart_guard_versions: "{{ php_multipart_guard_fpm_binaries.files | map(attribute='path') | map('basename') | map('regex_replace', '^php-fpm', '') | intersect(php_multipart_guard_shipped_versions) | sort }}"
  vars:
    php_multipart_guard_shipped_versions: "{{ lookup('ansible.builtin.fileglob', 'multipart-guard/*.so') | regex_findall('-([0-9]+\\.[0-9]+)\\.so') }}"

- name: Query extension_dir of php {{ php_multipart_guard_versions | join(', ') }}
  ansible.builtin.command: "php{{ item }} -n -r 'echo PHP_EXTENSION_DIR;'"
  loop: "{{ php_multipart_guard_versions }}"
  register: php_multipart_guard_extension_dirs
  changed_when: false

- block:
    - name: hp_multipart_guard-{{ item.item }}.so -> {{ item.stdout }}/hp_multipart_guard.so
      ansible.builtin.copy:
        src: "multipart-guard/hp_multipart_guard-{{ item.item }}.so"
        dest: "{{ item.stdout }}/hp_multipart_guard.so"
        mode: '0644'
      loop: "{{ php_multipart_guard_extension_dirs.results }}"
      loop_control:
        label: "{{ item.item }}"
      notify: restart php-fpm multipart guard versions

    - name: hp_multipart_guard.ini -> /etc/php/{{ item }}/mods-available/hp_multipart_guard.ini
      ansible.builtin.template:
        src: hp_multipart_guard.ini.j2
        dest: "/etc/php/{{ item }}/mods-available/hp_multipart_guard.ini"
        mode: '0644'
      loop: "{{ php_multipart_guard_versions }}"
      notify: restart php-fpm multipart guard versions

    - name: phpenmod hp_multipart_guard -> all SAPIs of {{ php_multipart_guard_versions | join(', ') }}
      ansible.builtin.command: "phpenmod -v {{ item }} -s ALL hp_multipart_guard"
      args:
        creates: "/etc/php/{{ item }}/fpm/conf.d/20-hp_multipart_guard.ini"
      loop: "{{ php_multipart_guard_versions }}"
      notify: restart php-fpm multipart guard versions

  when: php_multipart_guard_enabled | bool

- block:
    - name: phpdismod hp_multipart_guard -> all SAPIs of {{ php_multipart_guard_versions | join(', ') }}
      ansible.builtin.command: "phpdismod -v {{ item }} -s ALL hp_multipart_guard"
      args:
        removes: "/etc/php/{{ item }}/fpm/conf.d/20-hp_multipart_guard.ini"
      loop: "{{ php_multipart_guard_versions }}"
      notify: restart php-fpm multipart guard versions

    - name: Remove hp_multipart_guard.ini -> /etc/php/{{ item }}/mods-available/hp_multipart_guard.ini
      ansible.builtin.file:
        path: "/etc/php/{{ item }}/mods-available/hp_multipart_guard.ini"
        state: absent
      loop: "{{ php_multipart_guard_versions }}"

    - name: Remove hp_multipart_guard.so -> {{ item.stdout }}/hp_multipart_guard.so
      ansible.builtin.file:
        path: "{{ item.stdout }}/hp_multipart_guard.so"
        state: absent
      loop: "{{ php_multipart_guard_extension_dirs.results }}"
      loop_control:
        label: "{{ item.item }}"

  when: not php_multipart_guard_enabled | bool
