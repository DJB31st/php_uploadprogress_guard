name: Windows build

on:
  push:
    branches: [main]
    paths: ['src/**', 'config.w32', '.github/workflows/windows.yml']
  workflow_dispatch:

jobs:
  build:
    name: PHP ${{ matrix.php-version }} ${{ matrix.ts }} x64
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.1', '7.4']
        ts: [nts, ts]
    steps:
      - uses: actions/checkout@v4
      - name: Build the extension
        uses: php/php-windows-builder/extension@v1
        with:
          php-version: ${{ matrix.php-version }}
          arch: x64
          ts: ${{ matrix.ts }}
          args: --enable-hp-uploadprogress-guard
          run-tests: 'false'
      - name: Install a matching PHP to load the DLL
        if: matrix.ts == 'nts'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          ini-values: display_errors=stderr
      - name: Load the DLL and show --ri
        if: matrix.ts == 'nts'
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path artifacts -Filter *.zip -Recurse | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath built -Force
          $dll = Get-ChildItem -Path built -Filter php_hp_uploadprogress_guard.dll -Recurse | Select-Object -First 1
          php -n -d "extension=$($dll.FullName)" --ri hp_uploadprogress_guard
          if ($LASTEXITCODE -ne 0) { exit 1 }
